<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPulse | SPA Kanban Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- ============================================================== -->
    <!-- 1. AUTH SCREEN (Shown if not logged in)                        -->
    <!-- ============================================================== -->
    <section id="auth-section" class="flex-1 flex items-center justify-center p-6 relative overflow-hidden">
        <div class="glass-card w-full max-w-md p-8 sm:p-10 rounded-3xl shadow-2xl relative z-10 border border-slate-700/60">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-indigo-600 shadow-xl shadow-indigo-500/30 mb-3">
                    <i class="fa-solid fa-bolt text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">TaskPulse</h1>
                <p class="text-slate-400 text-sm mt-1">Real-Time Team Workspace</p>
            </div>

            <!-- Tab Switcher -->
            <div class="flex bg-slate-900/80 p-1 rounded-xl mb-6 border border-slate-800">
                <button id="tab-login-btn" class="flex-1 py-2 text-xs font-bold uppercase tracking-wider rounded-lg bg-indigo-600 text-white shadow-sm transition" onclick="switchAuthTab('login')">Sign In</button>
                <button id="tab-register-btn" class="flex-1 py-2 text-xs font-bold uppercase tracking-wider rounded-lg text-slate-400 hover:text-white transition" onclick="switchAuthTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="spa-login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email</label>
                    <input type="email" id="spa-login-email" required placeholder="admin@example.com" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
                    <input type="password" id="spa-login-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Register Form -->
            <form id="spa-register-form" class="space-y-4 hidden" enctype="multipart/form-data">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Name</label>
                    <input type="text" id="spa-reg-name" required placeholder="Anant Singh" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email</label>
                    <input type="email" id="spa-reg-email" required placeholder="you@company.com" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
                    <input type="password" id="spa-reg-password" required minlength="6" placeholder="Min 6 chars" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Role</label>
                    <select id="spa-reg-role" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="Member">Team Member</option>
                        <option value="Admin">Admin (Can delete tasks)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Avatar</label>
                    <input type="file" id="spa-reg-avatar" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white cursor-pointer">
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2">
                    <span>Create Account</span>
                    <i class="fa-solid fa-user-plus text-xs"></i>
                </button>
            </form>
        </div>
    </section>

    <!-- ============================================================== -->
    <!-- 2. DASHBOARD SCREEN                                            -->
    <!-- ============================================================== -->
    <div id="dashboard-section" class="hidden min-h-screen flex flex-col">
        <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 py-3.5">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2.5">
                        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-600/30">
                            <i class="fa-solid fa-bolt text-white text-lg"></i>
                        </div>
                        <span class="text-xl font-bold tracking-tight text-white">TaskPulse SPA</span>
                    </div>
                    <div class="hidden sm:flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                        <span id="socket-status">Live Connected</span>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="openModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl shadow-md transition flex items-center gap-2">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>New Task</span>
                    </button>
                    <div class="flex items-center gap-2.5 pl-3 border-l border-slate-800">
                        <img id="user-avatar" src="/uploads/default-avatar.png" alt="Avatar" class="w-9 h-9 rounded-full object-cover border border-indigo-500">
                        <div class="hidden md:block text-left">
                            <p id="user-name" class="text-sm font-semibold text-white leading-none">User</p>
                            <span id="user-role-badge" class="text-[10px] uppercase font-bold text-indigo-400">Member</span>
                        </div>
                        <button onclick="logout()" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-400 hover:text-rose-400 hover:bg-slate-800 transition" title="Logout">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl mx-auto w-full px-6 py-8">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="glass-card p-5 rounded-2xl">
                    <p class="text-xs text-slate-400 font-medium uppercase">Total Tasks</p>
                    <h3 id="stat-total" class="text-2xl font-bold text-white mt-1">0</h3>
                </div>
                <div class="glass-card p-5 rounded-2xl border-l-4 border-l-amber-500">
                    <p class="text-xs text-amber-400 font-medium uppercase">To Do</p>
                    <h3 id="stat-pending" class="text-2xl font-bold text-white mt-1">0</h3>
                </div>
                <div class="glass-card p-5 rounded-2xl border-l-4 border-l-indigo-500">
                    <p class="text-xs text-indigo-400 font-medium uppercase">In Progress</p>
                    <h3 id="stat-progress" class="text-2xl font-bold text-white mt-1">0</h3>
                </div>
                <div class="glass-card p-5 rounded-2xl border-l-4 border-l-emerald-500">
                    <p class="text-xs text-emerald-400 font-medium uppercase">Completed</p>
                    <h3 id="stat-completed" class="text-2xl font-bold text-white mt-1">0</h3>
                </div>
            </div>

            <!-- Kanban Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
                <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-4">
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                            <h2 class="font-bold text-xs uppercase tracking-wider text-slate-300">To Do</h2>
                        </div>
                        <span id="badge-pending-count" class="text-xs font-bold px-2 py-0.5 rounded-full bg-amber-400/10 text-amber-300">0</span>
                    </div>
                    <div id="col-pending" class="flex flex-col gap-3 min-h-[300px]"></div>
                </div>

                <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-4">
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-indigo-400"></span>
                            <h2 class="font-bold text-xs uppercase tracking-wider text-slate-300">In Progress</h2>
                        </div>
                        <span id="badge-progress-count" class="text-xs font-bold px-2 py-0.5 rounded-full bg-indigo-400/10 text-indigo-300">0</span>
                    </div>
                    <div id="col-progress" class="flex flex-col gap-3 min-h-[300px]"></div>
                </div>

                <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-4">
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                            <h2 class="font-bold text-xs uppercase tracking-wider text-slate-300">Completed</h2>
                        </div>
                        <span id="badge-completed-count" class="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-400/10 text-emerald-300">0</span>
                    </div>
                    <div id="col-completed" class="flex flex-col gap-3 min-h-[300px]"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="task-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden">
        <div class="glass-card w-full max-w-lg p-6 rounded-2xl border border-slate-700 shadow-2xl animate-scale-up">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-5">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-plus text-indigo-400"></i>
                    <span>Create New Task</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="spa-task-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Task Title</label>
                    <input type="text" id="spa-task-title" required placeholder="e.g. Build Payment Gateway" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Priority</label>
                    <select id="spa-task-priority" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition">Create Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
